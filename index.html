<script>
    // Данные маршрута
    var locations = [
        {
            id: "abudhabi",
            name: "Абу-Даби",
            coords: [24.4539, 54.3773],
            dates: "31.10 — 02.11",
            hotel: "City Seasons Al Hamra Abu Dhabi 4*",
            color: "#f39c12"
        },
        {
            id: "tokyo1",
            name: "Токио (Нингечо)",
            coords: [35.6865, 139.7850],
            dates: "02.11 — 05.11",
            hotel: "APA Hotel Ningyocho-Eki-Kita",
            color: "#e94560"
        },
        {
            id: "fuji",
            name: "Фудзикавагутико",
            coords: [35.5167, 138.7500],
            dates: "05.11 — 06.11",
            hotel: "Habitacion Niiya Mt Fuji 2*",
            color: "#3498db"
        },
        {

            name: "Киото",
            coords: [35.0116, 135.7681],
            dates: "06.11 — 09.11",
            hotel: "Miyako Kyoto Hotel Hahijo",
            color: "#9b59b6"
        },
        {
            id: "osaka",
            name: "Осака",
            coords: [34.6937, 135.5023],
            dates: "09.11 — 11.11",
            hotel: "Apa Hotel Osaka Temmabashi Ekimae",
            color: "#2ecc71"
        },
        {
            id: "tokyo2",
            name: "Токио (Нихонбаши)",
            coords: [35.6833, 139.7833],
            dates: "11.11 — 13.11",
            hotel: "Nishitetsu Inn Nihonbashi",
            color: "#e94560"
        }
    ];

    // Инициализация карты
    var map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([30, 100], 3);

// Основной провайдер — CartoDB (тёмный)
var cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
});

// Запасной провайдер — OpenStreetMap (работает везде)
var osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
});

// Если CartoDB не грузится — автоматически переключаемся на OSM
var errorsCount = 0;
cartoLayer.on('tileerror', function() {
    errorsCount++;
    if (errorsCount === 3) {
        console.warn('CartoDB недоступен, переключаюсь на OpenStreetMap');
        map.removeLayer(cartoLayer);
        osmLayer.addTo(map);
    }
});

cartoLayer.addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Хранилище маркеров
    var markers = {};

    // Рисуем маршрут
    var routePoints = locations.map(loc => loc.coords);

    L.polyline(routePoints, {
        color: '#e94560', weight: 3, opacity: 0.6,
        dashArray: '10, 10', lineJoin: 'round'
    }).addTo(map);

    L.polyline(routePoints, {
        color: '#fff', weight: 1, opacity: 0.3, lineJoin: 'round'
    }).addTo(map);

    // Добавляем маркеры
    locations.forEach((loc, index) => {
        var customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                background-color: ${loc.color};
                width: 14px; height: 14px;
                border-radius: 50%;
                border: 2px solid white;
                box-shadow: 0 0 10px ${loc.color}, 0 0 20px ${loc.color};
                transition: all 0.3s ease;
            "></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        var popupContent = `
            <div class="popup-content">
                <div class="date">${loc.dates}</div>
                <h3>${loc.name}</h3>
                <div class="hotel">🏨 ${loc.hotel}</div>
            </div>
        `;

        setTimeout(() => {
            var marker = L.marker(loc.coords, { icon: customIcon })
                .addTo(map)
                .bindPopup(popupContent, {
                    closeButton: false,
                    offset: [0, -5]
                });

            marker.on('mouseover', function() { this.openPopup(); });
            marker.on('mouseout', function() { this.closePopup(); });

            markers[loc.id] = marker;
            marker.getElement().style.animation = 'drop 0.5s ease-out';
        }, index * 300);
    });

    // ============ ГЕНЕРАЦИЯ ЛЕГЕНДЫ ============
    var legendBody = document.getElementById('legendBody');
    
    locations.forEach((loc, index) => {
        var item = document.createElement('div');
        item.className = 'legend-item';
        item.dataset.id = loc.id;
        item.innerHTML = `
            <div class="legend-dot" style="background-color: ${loc.color}; color: ${loc.color};"></div>
            <div class="legend-text">
                <div class="legend-city">${index + 1}. ${loc.name}</div>
                <div class="legend-dates">${loc.dates}</div>
            </div>
        `;

        // Наведение → подсветка маркера + открытие попапа
        item.addEventListener('mouseenter', function() {
            var marker = markers[loc.id];
            if (marker) {
                marker.openPopup();
                var el = marker.getElement();
                if (el) {
                    el.style.transform = 'scale(1.8)';
                    el.style.zIndex = '1000';
                }
            }
            // Подсветка всех элементов этого же города
            document.querySelectorAll(`.legend-item[data-id="${loc.id}"]`)
                .forEach(i => i.classList.add('active'));
        });

        item.addEventListener('mouseleave', function() {
            var marker = markers[loc.id];
            if (marker) {
                marker.closePopup();
                var el = marker.getElement();
                if (el) {
                    el.style.transform = '';
                    el.style.zIndex = '';
                }
            }
            document.querySelectorAll(`.legend-item[data-id="${loc.id}"]`)
                .forEach(i => i.classList.remove('active'));
        });

        // Клик → плавный перелёт к точке
        item.addEventListener('click', function() {
            map.flyTo(loc.coords, 12, {
                duration: 1.5,
                easeLinearity: 0.25
            });
            setTimeout(() => {
                if (markers[loc.id]) markers[loc.id].openPopup();
            }, 1600);
        });

        legendBody.appendChild(item);
    });

    // Добавляем прогресс-бар внизу легенды
    var progress = document.createElement('div');
    progress.className = 'route-progress';
    progress.innerHTML = `
        <span>6 городов</span>
        <span>13 дней</span>
        <span>2 страны</span>
    `;
    legendBody.appendChild(progress);

    // ============ КНОПКА СВОРАЧИВАНИЯ ============
    function toggleLegend() {
        var legend = document.getElementById('legend');
        var btn = legend.querySelector('.legend-toggle');
        legend.classList.toggle('collapsed');
        btn.textContent = legend.classList.contains('collapsed') ? '+' : '−';
    }

    // Авто-масштаб
    var bounds = L.latLngBounds(routePoints);
    map.fitBounds(bounds, { padding: [50, 50] });

    // Анимация появления
    var style = document.createElement('style');
    style.innerHTML = `
        @keyframes drop {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .legend { animation: slideIn 0.8s ease-out; }
    `;
    document.head.appendChild(style);
</script>

</body></html>
