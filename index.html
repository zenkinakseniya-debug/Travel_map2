<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта путешествия: Абу-Даби — Япония</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body, html { margin:0; padding:0; height:100%; font-family:'Segoe UI',Tahoma,sans-serif; background:#1a1a2e; }
  #map { height:100%; width:100%; background:#1a1a2e; }
  .leaflet-popup-content-wrapper { background:rgba(255,255,255,.95); border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.3); }
  .leaflet-popup-tip { background:rgba(255,255,255,.95); }
  .popup-content { color:#333; padding:5px; }
  .popup-content h3 { margin:0 0 5px 0; color:#e94560; font-size:16px; }
  .popup-content .hotel { font-weight:bold; color:#16213e; background:#f0f0f0; padding:2px 6px; border-radius:4px; display:inline-block; margin-top:4px; }
  .popup-content .date { color:#666; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .map-title { position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:1000; background:rgba(26,26,46,.85); color:#fff; padding:12px 30px; border-radius:50px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); box-shadow:0 4px 20px rgba(0,0,0,.4); font-weight:600; letter-spacing:1px; text-align:center; pointer-events:none; }
  .map-title span { color:#e94560; }
  .legend { position:absolute; bottom:30px; left:30px; z-index:1000; background:rgba(26,26,46,.9); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px 20px; box-shadow:0 10px 30px rgba(0,0,0,.5); color:#fff; min-width:260px; max-width:320px; }
  .legend h4 { margin:0 0 14px 0; font-size:14px; text-transform:uppercase; letter-spacing:2px; color:#e94560; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:10px; }
  .legend-item { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; cursor:pointer; transition:all .2s; margin-bottom:4px; border:1px solid transparent; }
  .legend-item:hover { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15); transform:translateX(4px); }
  .legend-dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; flex-shrink:0; box-shadow:0 0 8px currentColor; }
  .legend-text { display:flex; flex-direction:column; flex:1; min-width:0; }
  .legend-city { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .legend-dates { font-size:11px; color:rgba(255,255,255,.5); }
  .route-progress { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); font-size:11px; color:rgba(255,255,255,.5); display:flex; justify-content:space-between; }
  .route-progress span { color:#e94560; font-weight:600; }
  @keyframes drop { 0%{transform:translateY(-20px);opacity:0} 100%{transform:translateY(0);opacity:1} }
</style>
</head>
<body>

<div class="map-title">✈️ Маршрут: <span>Абу-Даби</span> → <span>Япония</span> 🇯🇵</div>
<div id="map"></div>
<div class="legend">
  <h4>📍 Маршрут путешествия</h4>
  <div id="legendBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var locations = [
  { id:"abudhabi", name:"Абу-Даби", coords:[24.4539,54.3773], dates:"31.10 — 02.11", hotel:"City Seasons Al Hamra Abu Dhabi 4*", color:"#f39c12" },
  { id:"tokyo1", name:"Токио (Нингечо)", coords:[35.6865,139.7850], dates:"02.11 — 05.11", hotel:"APA Hotel Ningyocho-Eki-Kita", color:"#e94560" },
  { id:"fuji", name:"Фудзикавагутико", coords:[35.5167,138.7500], dates:"05.11 — 06.11", hotel:"Habitacion Niiya Mt Fuji 2*", color:"#3498db" },
  { id:"kyoto", name:"Киото", coords:[35.0116,135.7681], dates:"06.11 — 09.11", hotel:"Miyako Kyoto Hotel Hahijo", color:"#9b59b6" },
  { id:"osaka", name:"Осака", coords:[34.6937,135.5023], dates:"09.11 — 11.11", hotel:"Apa Hotel Osaka Temmabashi Ekimae", color:"#2ecc71" },
  { id:"tokyo2", name:"Токио (Нихонбаши)", coords:[35.6833,139.7833], dates:"11.11 — 13.11", hotel:"Nishitetsu Inn Nihonbashi", color:"#e94560" }
];

var map = L.map('map',{ zoomControl:false, attributionControl:false }).setView([30,100],3);

var providers = [
  { url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', opts:{ subdomains:'abcd', maxZoom:19, attribution:'&copy; OSM &copy; CARTO' } },
  { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts:{ maxZoom:19, attribution:'&copy; OpenStreetMap' } },
  { url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', opts:{ subdomains:'abc', maxZoom:19, attribution:'&copy; OSM France' } }
];
var providerIndex = 0;
var tileErrors = 0;
var currentLayer = null;

function loadProvider(i) {
  if (currentLayer) map.removeLayer(currentLayer);
  if (i >= providers.length) { console.warn('Все провайдеры тайлов недоступны'); return; }
  var p = providers[i];
  currentLayer = L.tileLayer(p.url, p.opts);
  tileErrors = 0;
  currentLayer.on('tileerror', function(){
    tileErrors++;
    if (tileErrors === 3) { console.warn('Провайдер ' + i + ' не работает, переключаюсь...'); loadProvider(i+1); }
  });
  currentLayer.addTo(map);
}
loadProvider(0);

L.control.zoom({ position:'bottomright' }).addTo(map);

var markers = {};
var routePoints = locations.map(function(l){ return l.coords; });

L.polyline(routePoints,{ color:'#e94560', weight:3, opacity:.6, dashArray:'10, 10', lineJoin:'round' }).addTo(map);
L.polyline(routePoints,{ color:'#fff', weight:1, opacity:.3, lineJoin:'round' }).addTo(map);

locations.forEach(function(loc, index){
  var icon = L.divIcon({
    className:'custom-marker',
    html:'<div style="background-color:'+loc.color+';width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px '+loc.color+',0 0 20px '+loc.color+';"></div>',
    iconSize:[14,14], iconAnchor:[7,7]
  });
  var popup = '<div class="popup-content"><div class="date">'+loc.dates+'</div><h3>'+loc.name+'</h3><div class="hotel">🏨 '+loc.hotel+'</div></div>';
  setTimeout(function(){
    var m = L.marker(loc.coords,{ icon:icon }).addTo(map).bindPopup(popup,{ closeButton:false, offset:[0,-5] });
    m.on('mouseover', function(){ this.openPopup(); });
    m.on('mouseout', function(){ this.closePopup(); });
    markers[loc.id] = m;
    if (m.getElement()) m.getElement().style.animation = 'drop .5s ease-out';
  }, index*300);
});

var legendBody = document.getElementById('legendBody');
locations.forEach(function(loc, index){
  var item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.id = loc.id;
  item.innerHTML = '<div class="legend-dot" style="background-color:'+loc.color+';color:'+loc.color+';"></div>' +
    '<div class="legend-text"><div class="legend-city">'+(index+1)+'. '+loc.name+'</div>' +
    '<div class="legend-dates">'+loc.dates+'</div></div>';
  item.addEventListener('mouseenter', function(){
    var m = markers[loc.id];
    if (m) { m.openPopup(); if (m.getElement()) m.getElement().style.transform = 'scale(1.8)'; }
  });
  item.addEventListener('mouseleave', function(){
    var m = markers[loc.id];
    if (m) { m.closePopup(); if (m.getElement()) m.getElement().style.transform = ''; }
  });
  item.addEventListener('click', function(){
    map.flyTo(loc.coords, 12, { duration:1.5 });
    setTimeout(function(){ if (markers[loc.id]) markers[loc.id].openPopup(); }, 1600);
  });
  legendBody.appendChild(item);
});

var progress = document.createElement('div');
progress.className = 'route-progress';
progress.innerHTML = '<span>6 городов</span><span>13 дней</span><span>2 страны</span>';
legendBody.appendChild(progress);

map.fitBounds(L.latLngBounds(routePoints), { padding:[50,50] });
</script>
</body>
</html>
